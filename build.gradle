plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group_id
version = mod_version
base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()

    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.dries007.net' }

    flatDir {
        dirs '../libs'
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                pmweather_tfc {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            mods {
                pmweather_tfc {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "pmweather_tfc.refmap.json"
    config "mixins.pmweather_tfc.json"
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf(files('libs/pmweather-0.16.4-1.20.1-alpha.jar'))
    implementation fg.deobf(files('libs/TerraFirmaCraft-Forge-1.20.1-3.2.21.jar'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
